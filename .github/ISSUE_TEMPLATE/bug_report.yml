name: Bug report
description: gitd does not do what it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For a security problem, do not use this form: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: gitd --version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. The call you made …\n2. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
