name: github-e2e

# gitd against GitHub itself (e2e/github.sh): the gitd-e2e App, installed on
# dooservice/gitd-e2e only, publishes a pull request as its bot and is refused a change to
# the CI. Skipped where the App's secrets are not set, as in forks.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-e2e
  cancel-in-progress: false

# The workflow's own token only reads; anything that writes uses its own credential.
permissions:
  contents: read

jobs:
  github:
    runs-on: ubuntu-latest
    env:
      GITD_E2E_APP_ID: ${{ secrets.GITD_E2E_APP_ID }}
      GITD_E2E_APP_KEY: ${{ secrets.GITD_E2E_APP_KEY }}
    steps:
      - name: the App's secrets and client ID are set
        id: secrets
        env:
          GITD_E2E_CLIENT_ID: ${{ vars.GITD_E2E_CLIENT_ID }}
        run: |
          if [ -n "$GITD_E2E_APP_ID" ] && [ -n "$GITD_E2E_APP_KEY" ] && [ -n "$GITD_E2E_CLIENT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.set
      - uses: actions/setup-go@v7
        if: steps.secrets.outputs.set
        with:
          go-version-file: go.mod
      - run: make build
        if: steps.secrets.outputs.set
      - name: gitd against GitHub
        if: steps.secrets.outputs.set
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          REVIEWER: ${{ github.actor }}
        run: e2e/github.sh
      # The pull request and its branch are this run's to remove, with a token of the same
      # App made apart from gitd.
      - uses: actions/create-github-app-token@v3
        if: always() && steps.secrets.outputs.set
        id: cleanup
        with:
          client-id: ${{ vars.GITD_E2E_CLIENT_ID }}
          private-key: ${{ secrets.GITD_E2E_APP_KEY }}
          repositories: gitd-e2e
      - name: the pull request is the bot's, a draft, and says what gitd checked
        if: steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr view --repo dooservice/gitd-e2e "agents/e2e-$RUN" --json author,isDraft,labels,body > pull.json
          jq -e '.author.login == "app/gitd-e2e" and .isDraft and ([.labels[].name] | index("agent"))' pull.json
          jq -r .body pull.json | grep -F -- "- Changes: 1 file, +1 −0"
      - name: remove what the run pushed
        if: always() && steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for branch in "agents/e2e-$RUN" "agents/e2e-ci-$RUN"; do
            gh pr close --repo dooservice/gitd-e2e "$branch" --delete-branch 2>/dev/null \
              || gh api -X DELETE "repos/dooservice/gitd-e2e/git/refs/heads/$branch" 2>/dev/null || true
          done

  # The OpenHands example (examples/openhands): OpenHands' agent works in a workspace gitd
  # made, in a sandbox with no credential and no network, and gitd publishes its commit as a
  # pull request from the same App's bot, saying where the work came from.
  openhands:
    runs-on: ubuntu-latest
    needs: github
    env:
      GITD_E2E_APP_ID: ${{ secrets.GITD_E2E_APP_ID }}
      GITD_E2E_APP_KEY: ${{ secrets.GITD_E2E_APP_KEY }}
    steps:
      - name: the App's secrets and client ID are set
        id: secrets
        env:
          GITD_E2E_CLIENT_ID: ${{ vars.GITD_E2E_CLIENT_ID }}
        run: |
          if [ -n "$GITD_E2E_APP_ID" ] && [ -n "$GITD_E2E_APP_KEY" ] && [ -n "$GITD_E2E_CLIENT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.set
      - uses: actions/setup-go@v7
        if: steps.secrets.outputs.set
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.set
        with:
          python-version: "3.13"
      - run: make build && pip install ./sdk/python
        if: steps.secrets.outputs.set
      - name: OpenHands on a gitd workspace
        if: steps.secrets.outputs.set
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          REVIEWER: ${{ github.actor }}
        run: examples/openhands/demo.sh
      # The same agent taken over by a prompt injection: it finds no token, cannot push by
      # itself, and its commit adding a workflow is refused before anything is pushed.
      - name: an injected OpenHands agent is stopped
        if: steps.secrets.outputs.set
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SCENARIO: injected
        run: examples/openhands/demo.sh
      - uses: actions/create-github-app-token@v3
        if: always() && steps.secrets.outputs.set
        id: cleanup
        with:
          client-id: ${{ vars.GITD_E2E_CLIENT_ID }}
          private-key: ${{ secrets.GITD_E2E_APP_KEY }}
          repositories: gitd-e2e
      - name: the pull request is the bot's and says the work was OpenHands'
        if: steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr view --repo dooservice/gitd-e2e "agents/openhands-$RUN" --json author,files,body > pull.json
          jq -e --arg note "openhands/run-$RUN.md" '.author.login == "app/gitd-e2e" and ([.files[].path] == [$note])' pull.json
          jq -r .body pull.json | grep -F "Agent: OpenHands 1.55.1 (scripted) · session openhands-$RUN"
          if gh api "repos/dooservice/gitd-e2e/branches/agents/openhands-injected-$RUN" >/dev/null 2>&1; then
            echo "the injected agent's branch was pushed" >&2
            exit 1
          fi
      - name: remove what the run pushed
        if: always() && steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr close --repo dooservice/gitd-e2e "agents/openhands-$RUN" --delete-branch 2>/dev/null \
            || gh api -X DELETE "repos/dooservice/gitd-e2e/git/refs/heads/agents/openhands-$RUN" 2>/dev/null || true
          gh api -X DELETE "repos/dooservice/gitd-e2e/git/refs/heads/agents/openhands-injected-$RUN" 2>/dev/null || true

  # gitd's endpoint (e2e/endpoint.sh): a sandbox on its own network clones and pushes over
  # HTTP with a token of gitd's, and gitd publishes its branch from the same App's bot.
  endpoint:
    runs-on: ubuntu-latest
    needs: openhands
    env:
      GITD_E2E_APP_ID: ${{ secrets.GITD_E2E_APP_ID }}
      GITD_E2E_APP_KEY: ${{ secrets.GITD_E2E_APP_KEY }}
    steps:
      - name: the App's secrets and client ID are set
        id: secrets
        env:
          GITD_E2E_CLIENT_ID: ${{ vars.GITD_E2E_CLIENT_ID }}
        run: |
          if [ -n "$GITD_E2E_APP_ID" ] && [ -n "$GITD_E2E_APP_KEY" ] && [ -n "$GITD_E2E_CLIENT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.set
      - uses: actions/setup-go@v7
        if: steps.secrets.outputs.set
        with:
          go-version-file: go.mod
      - run: make build
        if: steps.secrets.outputs.set
      - name: a sandbox elsewhere, through the endpoint
        if: steps.secrets.outputs.set
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: e2e/endpoint.sh
      - uses: actions/create-github-app-token@v3
        if: always() && steps.secrets.outputs.set
        id: cleanup
        with:
          client-id: ${{ vars.GITD_E2E_CLIENT_ID }}
          private-key: ${{ secrets.GITD_E2E_APP_KEY }}
          repositories: gitd-e2e
      - name: the pull request is the bot's
        if: steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr view --repo dooservice/gitd-e2e "agents/endpoint-$RUN" --json author,files > pull.json
          jq -e --arg file "endpoint-$RUN.txt" '.author.login == "app/gitd-e2e" and ([.files[].path] == [$file])' pull.json
      - name: remove what the run pushed
        if: always() && steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh pr close --repo dooservice/gitd-e2e "agents/endpoint-$RUN" --delete-branch 2>/dev/null \
            || gh api -X DELETE "repos/dooservice/gitd-e2e/git/refs/heads/agents/endpoint-$RUN" 2>/dev/null || true

  # Kubernetes (examples/kubernetes): on a kind cluster, a pod gets a workspace as a gitd.dev
  # CSI volume, commits with no credential in it, and gitd publishes what it committed.
  kubernetes:
    runs-on: ubuntu-latest
    needs: endpoint
    env:
      GITD_E2E_APP_ID: ${{ secrets.GITD_E2E_APP_ID }}
      GITD_E2E_APP_KEY: ${{ secrets.GITD_E2E_APP_KEY }}
    steps:
      - name: the App's secrets and client ID are set
        id: secrets
        env:
          GITD_E2E_CLIENT_ID: ${{ vars.GITD_E2E_CLIENT_ID }}
        run: |
          if [ -n "$GITD_E2E_APP_ID" ] && [ -n "$GITD_E2E_APP_KEY" ] && [ -n "$GITD_E2E_CLIENT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.set
      - uses: helm/kind-action@v1
        if: steps.secrets.outputs.set
        with:
          cluster_name: gitd
      - name: a pod's workspace, published
        if: steps.secrets.outputs.set
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/credentials"
          printf '%s\n' "$GITD_E2E_APP_KEY" > "$RUNNER_TEMP/credentials/app.pem"
          export CREDENTIALS_DIR="$RUNNER_TEMP/credentials" BRANCH="agents/kubernetes-$RUN" \
            REPOSITORY=https://github.com/dooservice/gitd-e2e \
            CONFIG="$(printf '[[credentials]]\nprefix = "https://github.com/dooservice/gitd-e2e"\ngithub_app = { app_id = %s, private_key_file = "/etc/gitd/credentials/app.pem" }\n' "$GITD_E2E_APP_ID")"
          examples/kubernetes/demo.sh | tee demo.log
          grep -q "no credential in the pod" demo.log
          grep -q '"branch": "agents/kubernetes-' examples/kubernetes/published.json
          grep -qx "removed" demo.log
      - uses: actions/create-github-app-token@v3
        if: always() && steps.secrets.outputs.set
        id: cleanup
        with:
          client-id: ${{ vars.GITD_E2E_CLIENT_ID }}
          private-key: ${{ secrets.GITD_E2E_APP_KEY }}
          repositories: gitd-e2e
      - name: the branch is on GitHub, with the pod's commit
        if: steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api "repos/dooservice/gitd-e2e/commits/agents/kubernetes-$RUN" --jq .commit.message | grep -F "kubernetes: run $RUN"
      - name: remove what the run pushed
        if: always() && steps.secrets.outputs.set
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: gh api -X DELETE "repos/dooservice/gitd-e2e/git/refs/heads/agents/kubernetes-$RUN" 2>/dev/null || true
