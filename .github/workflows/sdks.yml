name: sdks

# Publishes the clients with each release: gitd on PyPI, gitd-client on npm and on
# crates.io, and the Go client under the module's own version. PyPI and npm trust this
# workflow by OIDC (trusted publishing), so no token is kept for them; crates.io does too
# once its trusted publisher is set, until then it takes the CARGO_REGISTRY_TOKEN secret.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  python:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The package's version is the release's
        run: grep -qx "version = \"${GITHUB_REF_NAME}\"" pyproject.toml
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: sdk/python/dist

  typescript:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The package's version is the release's
        run: '[ "$(node -p "require(\"./package.json\").version")" = "${GITHUB_REF_NAME}" ]'
      - run: npm ci
      - run: npm publish --access public

  # Go finds a module's versions by tags that start with v: 0.13.0 is also tagged v0.13.0,
  # on the same commit, and the module proxy is asked for it so `go get` finds it at once.
  go:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag v${{ github.ref_name }}
        run: |
          git tag "v${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "v${GITHUB_REF_NAME}"
      - name: The module proxy has it
        run: curl -fsS "https://proxy.golang.org/github.com/dooservice/gitd/@v/v${GITHUB_REF_NAME}.info"

  # crates.io lets a trusted publisher be set only on a crate that exists: the first release
  # publishes with the environment's CARGO_REGISTRY_TOKEN secret, the next ones by OIDC once
  # the secret is removed.
  rust:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      KEPT_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - name: The crate's version is the release's
        run: grep -qx "version = \"${GITHUB_REF_NAME}\"" Cargo.toml
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.KEPT_TOKEN == ''
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.KEPT_TOKEN }}
