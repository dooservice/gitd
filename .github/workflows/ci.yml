name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow's own token only reads; anything that writes uses its own credential.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make lint
      - run: make test
      - name: generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          make generate
          git diff --exit-code gen sdk/python/src/gitd/contract.json
      - name: The contract only grows, against the last release
        run: |
          git fetch --quiet --tags --depth=1 origin
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          buf breaking --against ".git#tag=${latest}"
      - run: make build
      # Mounting takes root; these tests skip without it.
      - name: overlay tests, as root
        run: sudo -E env "PATH=$PATH" go test -count=1 ./internal/strategy/ ./internal/mounthelper/ ./internal/workspace/ ./internal/csi/

  # Both clients reach a gitd on the network, over TLS, with its key (e2e/remote-sdks.sh).
  remote-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make build && pip install ./sdk/python
      - run: cd sdk/typescript && npm ci && npm run build
      - run: e2e/remote-sdks.sh

  # The network example: two tenants on one gitd, and a sandbox on its own network that
  # clones and pushes with a token of gitd's, nothing mounted.
  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run the example
        run: |
          set -o pipefail
          examples/network/demo.sh | tee demo.log
          grep -q "unauthenticated" demo.log
          grep -q "no credential of the git host in the sandbox" demo.log
          grep -qx "refused" demo.log
          grep -q "no tokens alive" demo.log
      - name: Clean up
        if: always()
        run: examples/network/demo.sh down

  # macOS (1.0 · 0): the tests, and workspaces cloned by APFS, measured.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o bin/gitd ./cmd/gitd
      - name: Ten workspaces cloned by APFS
        run: |
          set -o pipefail
          benchmarks/macos.sh https://github.com/OCA/web 10 | tee results.md
          grep -q "made by reflink" results.md
          grep -q "Clean checkouts as git sees them: 10 of 10" results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"

  # The bubblewrap example (docs/guides/claude-code-and-codex.md): a command isolated as
  # Claude Code and Codex isolate theirs writes only its workspace.
  bubblewrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Ubuntu 24.04 keeps unprivileged user namespaces, which bubblewrap needs, behind AppArmor.
      - run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y bubblewrap > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make build
      - name: Run the example
        run: |
          set -o pipefail
          examples/bubblewrap/demo.sh | tee demo.log
          grep -q "agent was here" demo.log
          grep -q "cannot write outside the workspace" demo.log
          grep -q "socket is not there" demo.log

  # Every strategy gitd may pick, under what an agent does with git (roadmap D5): copy, the
  # kernel's overlay (root) and reflink (an XFS disk made for it).
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: An XFS disk for reflink
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y xfsprogs >/dev/null
          truncate -s 1G "$RUNNER_TEMP/xfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          sudo mkdir -p /mnt/xfs && sudo mount -o loop "$RUNNER_TEMP/xfs.img" /mnt/xfs
      - name: conformance, as root
        run: sudo -E env "PATH=$PATH" GITD_CONFORMANCE_XFS=/mnt/xfs go test -count=1 -v ./internal/conformance/

  # The sandboxes example, as gitd is deployed: unprivileged gitd, gitd-mount with its
  # unit's capabilities only. The one test where gitd-mount runs without full root.
  sandboxes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run the example
        run: |
          set -o pipefail
          examples/sandboxes/demo.sh | tee demo.log
          grep -q "workspaces made by overlay" demo.log
          [ "$(grep -c "made by overlay$" demo.log)" -eq 2 ]
          grep -q "agent-1 was here" demo.log
      - name: Clean up
        if: always()
        run: examples/sandboxes/demo.sh down
