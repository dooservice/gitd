name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make lint
      - run: make test
      - name: generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          buf generate
          git diff --exit-code gen
      - run: make build
      # Mounting takes root; these tests skip without it.
      - name: overlay tests, as root
        run: sudo -E env "PATH=$PATH" go test -count=1 ./internal/strategy/ ./internal/mounthelper/
