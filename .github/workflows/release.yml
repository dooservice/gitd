name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: Build
        env:
          GITD_LOGIN_CLIENT_ID: ${{ vars.GITD_LOGIN_CLIENT_ID }}
          GITD_LOGIN_APP: ${{ vars.GITD_LOGIN_APP }}
        run: |
          make build VERSION="${GITHUB_REF_NAME}"
          [ "$(bin/gitd -version)" = "${GITHUB_REF_NAME}" ]
          mkdir -p dist
          for arch in amd64 arm64; do
            for command in gitd gitd-mount gitd-csi; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} \
                  -X github.com/dooservice/gitd/internal/config.loginClientID=${GITD_LOGIN_CLIENT_ID} \
                  -X github.com/dooservice/gitd/internal/config.loginApp=${GITD_LOGIN_APP}" \
                -o "dist/${command}-linux-${arch}" "./cmd/${command}"
              sha256sum "dist/${command}-linux-${arch}" | cut -d' ' -f1 > "dist/${command}-linux-${arch}.sha256"
            done
            # macOS: gitd only; gitd-mount and gitd-csi are Linux's.
            CGO_ENABLED=0 GOOS=darwin GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} \
                -X github.com/dooservice/gitd/internal/config.loginClientID=${GITD_LOGIN_CLIENT_ID} \
                -X github.com/dooservice/gitd/internal/config.loginApp=${GITD_LOGIN_APP}" \
              -o "dist/gitd-darwin-${arch}" ./cmd/gitd
            sha256sum "dist/gitd-darwin-${arch}" | cut -d' ' -f1 > "dist/gitd-darwin-${arch}.sha256"
          done
      # The notes are docs/releases/<version>.md, written with the release.
      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || printf 'gitd %s\n' "${GITHUB_REF_NAME}" > "$notes"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          body_path: ${{ env.NOTES }}
          files: dist/*

  # ghcr.io/dooservice/gitd:<version> and :latest, for amd64 and arm64.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GITD_LOGIN_CLIENT_ID=${{ vars.GITD_LOGIN_CLIENT_ID }}
            GITD_LOGIN_APP=${{ vars.GITD_LOGIN_APP }}
          tags: |
            ghcr.io/dooservice/gitd:${{ github.ref_name }}
            ghcr.io/dooservice/gitd:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dooservice/gitd
            org.opencontainers.image.description=Instant, secretless git checkouts for agent sandboxes
            org.opencontainers.image.licenses=Apache-2.0
