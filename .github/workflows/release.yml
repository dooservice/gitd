name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: Build
        run: |
          make build VERSION="${GITHUB_REF_NAME}"
          [ "$(bin/gitd -version)" = "${GITHUB_REF_NAME}" ]
          mkdir -p dist
          for arch in amd64 arm64; do
            for command in gitd gitd-mount; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${command}-linux-${arch}" "./cmd/${command}"
              sha256sum "dist/${command}-linux-${arch}" | cut -d' ' -f1 > "dist/${command}-linux-${arch}.sha256"
            done
          done
      - uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          files: dist/*

  # ghcr.io/dooservice/gitd:<version> and :latest, for amd64 and arm64.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/dooservice/gitd:${{ github.ref_name }}
            ghcr.io/dooservice/gitd:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dooservice/gitd
            org.opencontainers.image.description=Instant, secretless git checkouts for agent sandboxes
            org.opencontainers.image.licenses=Apache-2.0
