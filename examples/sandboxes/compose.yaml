# Two agent sandboxes, each with its own workspace of the same repository. gitd fetches it
# once into a pool; each workspace borrows its objects, and each sandbox mounts the pools
# read only, at the same path, which is where the workspace's alternates point. No sandbox
# holds a credential: publishing goes through gitd.
#
#   docker compose up -d gitd
#   docker compose exec gitd gitd prepare https://github.com/OCA/web /var/lib/gitd/workspaces/agent-1
#   docker compose exec gitd gitd prepare https://github.com/OCA/web /var/lib/gitd/workspaces/agent-2
#   docker compose run --rm agent-1 git log -1
#
# ./demo.sh runs it all.
services:
  gitd:
    build: ../..
    image: ghcr.io/dooservice/gitd:latest
    volumes:
      - ./gitd.toml:/etc/gitd/gitd.toml:ro
      - pools:/var/lib/gitd
      - workspaces:/var/lib/gitd/workspaces
    environment:
      GITD_TOKEN: ${GITD_TOKEN:-}

  agent-1: &agent
    image: ghcr.io/dooservice/gitd:latest
    entrypoint: []
    profiles: [agents]
    user: "1000:1000"
    working_dir: /work
    environment:
      GIT_AUTHOR_NAME: agent-1
      GIT_AUTHOR_EMAIL: agent-1@example.com
      GIT_COMMITTER_NAME: agent-1
      GIT_COMMITTER_EMAIL: agent-1@example.com
    volumes:
      - type: volume
        source: pools
        target: /var/lib/gitd
        read_only: true
      - type: volume
        source: workspaces
        target: /work
        volume:
          subpath: agent-1

  agent-2:
    <<: *agent
    environment:
      GIT_AUTHOR_NAME: agent-2
      GIT_AUTHOR_EMAIL: agent-2@example.com
      GIT_COMMITTER_NAME: agent-2
      GIT_COMMITTER_EMAIL: agent-2@example.com
    volumes:
      - type: volume
        source: pools
        target: /var/lib/gitd
        read_only: true
      - type: volume
        source: workspaces
        target: /work
        volume:
          subpath: agent-2

volumes:
  pools:
  workspaces:
