# gitd-mount: who may ask, and where. Root's, and writable by root only: whoever could
# write this could mount anywhere. The directories must match gitd's configuration:
# templates and layers under its state, roots as its roots. With tenants, give templates,
# layers and root once per tenant: /var/lib/gitd/tenants/<name>/templates and so on.
user gitd
templates /var/lib/gitd/templates
layers /var/lib/gitd/layers
root /var/lib/gitd/workspaces
