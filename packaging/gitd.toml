# Every key shows its default; a missing file is the defaults.

# The Unix socket gitd answers on. Only the user that runs gitd should reach it.
# `-socket` on the command line wins over it.
socket = "/run/gitd/gitd.sock"
# Pools, lock files and the host keys ssh is handed.
state = "/var/lib/gitd"
# The only directories a workspace may be made in.
roots = ["/var/lib/gitd/workspaces"]
git = "git"
# Where Prometheus metrics are served (e.g. "127.0.0.1:9419"); empty serves none.
metrics = ""
# SSH host keys trusted besides the built-in ones (github.com, gitlab.com, bitbucket.org,
# codeberg.org): one file per self-hosted GitLab, Gitea, Forgejo… in known_hosts format,
# e.g. the output of `ssh-keyscan git.example.com`, checked against what its admin publishes.
known_hosts = []

# Hosts reached on other ports than HTTPS on 443 and SSH on 22, or over SSH as another user
# than `git`, e.g. a Gitea on :3000 and :2222 (its SSH key goes in a known_hosts file as
# `[git.example.com]:2222 ssh-ed25519 …`). Every form of address of its repositories, with
# or without a port, names the same repository.
# [hosts."git.example.com"]
# https_port = 3000
# ssh_port = 2222
# ssh_user = "git"

# The key that encrypts the secrets of connections made through the API (tokens, GitHub
# App keys, sign-ins), kept under <state>/connections: 32 bytes, raw, hex or base64, best a
# systemd credential. Without one, those files are readable by gitd's user only.
# secrets_key_file = "/run/credentials/gitd.service/secrets"

# Credentials gitd keeps, so that whoever asks for a workspace or a branch never holds one.
# Platforms usually add them through the API instead (`gitd connect github`, or
# ConnectionService in the SDKs); those declared here are shown there and never changed.
# Each names where its secret is, never the secret: a token file (best a systemd credential,
# `LoadCredential=` in gitd.service, which lives in memory at $CREDENTIALS_DIRECTORY), an
# environment variable, an SSH key, or a GitHub App's key. The most specific prefix that
# opens a repository is used; a credential a request brings wins over a kept one of the
# same prefix.
# [[credentials]]
# prefix = "https://github.com/your-org"
# token_file = "/run/credentials/gitd.service/github"
#
# [[credentials]]
# prefix = "https://gitlab.com/your-group"
# token_env = "GITLAB_TOKEN"
# token_user = "oauth2"          # default: the one the host expects
#
# [[credentials]]
# prefix = ""                    # any repository, e.g. a deploy key for everything public
# ssh_key = "/etc/gitd/keys/id_ed25519"
#
# [[credentials]]                # a GitHub App: a token of an hour for one repository each time
# prefix = "https://github.com/your-org"
# github_app = { app_id = 123456, private_key_file = "/run/credentials/gitd.service/github-app.pem" }

# The GitHub App people sign in through with `gitd connect github`: by default the one gitd
# was built with (gitd's releases and image carry gitd-app); set both to use your own, as a
# GitHub Enterprise Server needs. A client ID is not a secret.
[github]
# login_client_id = "Iv23…"
# login_app = "your-app"

[publish]
# Every published branch must start with this; empty allows any new branch. Publishing never
# pushes over a branch that exists, so a prefix keeps agents off every branch people use.
branch_prefix = ""               # e.g. "agents/"

# Presets: named sets of rules settings take by name. gitd has its own, "recommended"
# (protects the CI, CODEOWNERS and .gitmodules; keeps tests; 200 files); one of that name
# replaces it. Platforms usually set them through the API (`gitd publishing preset set`).
# [[publish.presets]]
# name = "strict"
# protected_paths = [".github/**", "deploy/**"]
# kept_paths = ["migrations/**"]
# max_changed_files = 50

# The rules publishing follows for the repositories under a prefix ("" for every one).
# Platforms usually set them through the API (`gitd publishing set`, or PublishingService);
# those declared here are shown there and never changed. Every setting whose prefix opens
# a repository applies: paths add up and the smallest file limit wins, so a narrower setting
# never loosens a broader one. Checked on the commits to push, before anything is pushed.
# [[publish.settings]]
# prefix = "https://github.com/your-org"
# preset = "recommended"                   # a preset, by name, whose rules these take
# protected_paths = ["deploy/**"]          # may not be changed, as git's glob pathspecs
# kept_paths = ["migrations/**"]           # may change, not be deleted or renamed away
# allowed_paths = [".gitmodules"]          # left free of these settings' own rules
# max_changed_files = 100
# branch_prefix = "agents/"                # must start with every broader one
# pull_requests = { open = "always", draft = true, labels = ["agent"], request_review_from_requester = true }

# Every publish, done or refused, and every change to connections and publishing settings,
# one JSON line each in <state>/audit/publishes.jsonl.
[audit]
rotate_bytes = 16777216          # the file is rotated at this size (16 MiB)
keep = "8760h"                   # a rotated file is deleted after this long (a year)

[limits]
fetches = 4
writes = 8
queued = 32
queue_wait = "5m"
operation = "30m"

[housekeeping]
every = "6h"
retire_after = "720h"
stale_lock = "1h"
# How many directories below a root the deepest workspace sits.
sweep_depth = 4
