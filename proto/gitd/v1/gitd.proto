syntax = "proto3";

package gitd.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dooservice/gitd/gen/go/gitd/v1;gitdv1";

// The copies of git repositories on one server: a pool per repository, which is the only
// copy that talks to the network, and the workspaces checked out from it.
//
// Long operations stream their progress and end with their result. Every request that may
// reach the network carries its own credentials; gitd keeps them in memory for that request
// and never writes them down.

service WorkspaceService {
  // Create a workspace at a path, from the repository's pool, at a branch or a commit.
  rpc Prepare(PrepareRequest) returns (stream PrepareResponse);
  // Bring a workspace to the tip of its branch.
  rpc Update(UpdateRequest) returns (stream UpdateResponse);
  // Move a workspace to a commit, as a rollback does; the pool fetches it when it lacks it.
  rpc Checkout(CheckoutRequest) returns (stream CheckoutResponse);
  // Check out every submodule the workspace declares, or one.
  rpc SyncSubmodules(SyncSubmodulesRequest) returns (stream SyncSubmodulesResponse);
  // What the workspace is on disk right now, without the network.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Delete a workspace. Its pool stays.
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // Take an existing clone in, linking it to a pool without fetching anything.
  rpc Adopt(AdoptRequest) returns (stream AdoptResponse);
  // Push what was committed in a workspace to a new branch, with a token, so a pull or merge
  // request can be opened from it. New commits of its submodules go first, each to a
  // branch of the same name in its own repository. The branch must start with the
  // configured prefix, if there is one; every publish, done or refused, is in the audit log.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // What was changed in a workspace since gitd last put it on a commit — committed or not:
  // each file added, modified or deleted, with its lines. On an overlay workspace it is read
  // from the agent's own layer, and no git runs in the workspace.
  rpc Changes(ChangesRequest) returns (ChangesResponse);
  // The unified diff of a workspace's changes, of some files or all, cut short at a size.
  rpc Diff(DiffRequest) returns (DiffResponse);
  // How two works differ — two workspaces, two published branches, or one of each — file by
  // file, with their lines and, when asked, their diff: what choosing between attempts at
  // one task needs.
  rpc Compare(CompareRequest) returns (CompareResponse);
  // Whether the committed work of several workspaces or published branches merges cleanly,
  // pair by pair, and on which files it does not. Read with git merge-tree in the pool,
  // running none of the repository's code.
  rpc Conflicts(ConflictsRequest) returns (ConflictsResponse);
  // What happens to workspaces as it happens: made, changed, published, refused, removed.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Seal an overlay workspace's own layer — what installing its dependencies wrote — as a
  // warm layer of its repository, named, for later workspaces at the same commit to stand
  // on (PrepareRequest.warm) instead of installing again. The workspace is removed: its
  // layer is moved, not copied.
  rpc Seal(SealRequest) returns (SealResponse);
  // The warm layers of a repository.
  rpc ListWarm(ListWarmRequest) returns (ListWarmResponse);
}

service RepositoryService {
  // Whether a repository can be read with these credentials, and its branches.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

service ServerService {
  // Which gitd answers, and on which git, so a client can tell whether it may use it.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Remove now the pools no workspace borrows from and nothing has used for at least
  // `unused_for_seconds`, as the maintenance round does after `retire_after`.
  rpc Retire(RetireRequest) returns (RetireResponse);
  // The audit log: every publish, done or refused, and every change to connections and
  // publishing settings, newest first.
  rpc Audit(AuditRequest) returns (AuditResponse);
}

// The credentials gitd keeps, managed by a platform from its own pages instead of a file:
// GitHub connected through the organisation's own App, by signing in, or through an App
// the platform already has; and tokens for any host. gitd keeps them under its state
// directory, applies them at once, and never answers with a secret. None of this is
// offered to agents through MCP.
service ConnectionService {
  // Start creating the organisation's own GitHub App from a manifest: the answer says
  // where the person's browser posts the manifest. GitHub then sends the person to
  // `redirect_url` with a code and the state, for CompleteGitHubApp.
  rpc BeginGitHubApp(BeginGitHubAppRequest) returns (BeginGitHubAppResponse);
  // Finish creating the App: gitd exchanges the code for the App's ID and private key and
  // keeps them. The person then installs the App on the repositories it may reach.
  rpc CompleteGitHubApp(CompleteGitHubAppRequest) returns (CompleteGitHubAppResponse);
  // Start signing in to GitHub with gitd's public App (GitHub's device flow): the answer
  // has the code the person enters at GitHub.
  rpc StartGitHubLogin(StartGitHubLoginRequest) returns (StartGitHubLoginResponse);
  // Wait until the person has entered the code, and keep the sign-in. Pull requests then
  // appear as that person.
  rpc FinishGitHubLogin(FinishGitHubLoginRequest) returns (FinishGitHubLoginResponse);
  // Keep a GitHub App the platform already has, by its ID and private key.
  rpc AddGitHubApp(AddGitHubAppRequest) returns (AddGitHubAppResponse);
  // Keep a token for the repositories under a prefix, on any host.
  rpc AddToken(AddTokenRequest) returns (AddTokenResponse);
  // The connections gitd keeps, those of the configuration file included, never a secret.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  // Forget a connection made through the API. One from the configuration file is refused.
  rpc RemoveConnection(RemoveConnectionRequest) returns (RemoveConnectionResponse);
}

// The rules publishing follows, per repository prefix, managed by a platform from its own
// pages instead of a file: which paths a publish may not change or delete, how many files
// it may change, the branch prefix, and how pull requests are opened; and the presets,
// named sets of rules that settings use.
service PublishingService {
  // Every setting, those of the configuration file included.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Keep the settings of a prefix, replacing those it had.
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse);
  // Forget the settings of a prefix. Those of the configuration file are refused.
  rpc RemoveSettings(RemoveSettingsRequest) returns (RemoveSettingsResponse);
  // Every preset: gitd's own (`recommended`), the configuration file's and those set
  // through the API, as they apply.
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  // Keep a preset, replacing one of the same name; one named `recommended` replaces gitd's.
  rpc SetPreset(SetPresetRequest) returns (SetPresetResponse);
  // Forget a preset set through the API: refused while settings use it, unless gitd has its
  // own of that name, which then applies again.
  rpc RemovePreset(RemovePresetRequest) returns (RemovePresetResponse);
}

// gitd's git endpoint, for sandboxes that cannot mount its directories — microVMs, remote
// sandboxes, CI runners elsewhere — and clone over HTTP instead. A token of gitd's own opens
// one repository for reading and one sandbox repository for writing; it is never the git
// host's credential. What a sandbox pushed is published with Publish and `sandbox`.
service EndpointService {
  // A token for a sandbox, with the address it clones from. The repository's pool is
  // synced first, with the credential gitd keeps.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  // End a token now, and remove its sandbox repository when asked.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // The tokens alive, never their secrets.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
}

// What opens repositories whose address starts with `url_prefix`, on any host:
// e.g. `https://github.com/acme/` or `https://gitlab.example.com/acme/tools/`. A port in
// it is ignored, as it is in a repository's address: ports are the host's (gitd.toml).
message Credential {
  string url_prefix = 1;
  oneof secret {
    // Sent as `Authorization: Basic <https_user>:<token>`. A repository this opens is
    // read over HTTPS even when it was written as `git@` or `ssh://`.
    string https_token = 2;
    // A private key that is already on this server.
    string ssh_key_path = 3;
  }
  // The user name that goes with `https_token`. Empty is the one the host expects for a
  // token: `oauth2` on gitlab.com, `x-token-auth` on bitbucket.org and `x-access-token`
  // anywhere else (GitHub, and Gitea and Forgejo, which take any name). A self-hosted
  // GitLab wants `oauth2`, and a Bitbucket app password the account's own name.
  string https_user = 4;
}

// Where a workspace points: a branch, or a commit, or the repository's default branch.
message Revision {
  oneof target {
    string branch = 1;
    string commit = 2;
  }
}

message Progress {
  // What git is doing: "Receiving objects", "Resolving deltas", "Submodule vendor/web".
  string phase = 1;
  // 0 to 100, or -1 when git does not say.
  int32 percent = 2;
  // Which repository it is about, for an operation that touches several.
  string repository = 3;
}

message SubmoduleState {
  string path = 1;
  string url = 2;
  string commit = 3;
  bool checked_out = 4;
}

// A submodule that could not be brought in, and why. The rest of the operation went on.
message PendingSubmodule {
  string url = 1;
  string path = 2;
  GitFailure failure = 3;
}

// Attached to every error as a detail.
message GitFailure {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_AUTH_REQUIRED = 1;
    REASON_AUTH_REFUSED = 2;
    REASON_NOT_FOUND = 3;
    REASON_BAD_ADDRESS = 4;
    REASON_PATH_REFUSED = 5;
    REASON_BUSY = 6;
    REASON_TIMEOUT = 7;
    REASON_CORRUPT = 8;
    REASON_GIT_FAILED = 9;
    REASON_NOTHING_NEW = 10;
    // The branch is outside the prefix publishing is limited to.
    REASON_BRANCH_REFUSED = 11;
    // The workspace's git configuration sets something gitd does not run git under, such
    // as a filter or a hook path: whoever writes in the workspace could otherwise have gitd
    // run a command of theirs.
    REASON_CONFIG_REFUSED = 12;
    // What a publish brings breaks a publishing rule: a protected path changed, a kept
    // path deleted, or too many files changed. Nothing was pushed.
    REASON_POLICY_REFUSED = 13;
    // What was asked cannot be done with this host, such as a pull request where gitd does
    // not know the host's API.
    REASON_UNSUPPORTED = 14;
    // A limit of the tenant is reached: its workspaces, its disk or its tokens.
    REASON_LIMIT_REACHED = 15;
  }
  Reason reason = 1;
  // The last useful line git wrote, e.g. "remote: Repository not found.".
  string git_said = 2;
  // The repository the failure is about.
  string repository = 3;
}

message PrepareRequest {
  // The repository: `https://host/owner/[group/…]name`, `user@host:owner/name` or
  // `ssh://user@host[:port]/owner/name`, with or without `.git`.
  string url = 1;
  // An absolute path inside one of the roots gitd is configured with.
  string path = 2;
  Revision revision = 3;
  bool with_submodules = 4;
  repeated Credential credentials = 5;
  // The repository's whole history, for `git log` and `git blame` to go back as far as in
  // a clone; later updates keep it.
  // Otherwise only what is checked out, without the history behind it; submodules are
  // always so.
  bool full_history = 6;
  // How to make it, when there is a preference: STRATEGY_COPY writes every file even where
  // an overlay could be mounted. Unspecified is gitd's choice, the fastest this machine
  // allows. A strategy that cannot run here falls back to copy; the result says which ran.
  Strategy strategy = 7;
  // A warm layer of the repository to stand on, between the template and the workspace's
  // own layer: its dependencies are there already. The workspace must be at the commit the
  // layer was sealed at, and be made by overlay.
  string warm = 8;
}

// How a workspace was made.
enum Strategy {
  STRATEGY_UNSPECIFIED = 0;
  // Every file written.
  STRATEGY_COPY = 1;
  // A layer of its own mounted on a shared template, read only: milliseconds, and only
  // what changes takes disk.
  STRATEGY_OVERLAY = 2;
  // The template cloned block by block: almost no disk.
  STRATEGY_REFLINK = 3;
}

// The directories of an overlay workspace: the template below, read only, and the
// workspace's own layer above.
message Layers {
  string lower = 1;
  string upper = 2;
  string work = 3;
  // The warm layer between the template and the workspace's own, when it stands on one.
  string warm = 4;
}

message PrepareResponse {
  oneof event {
    Progress progress = 1;
    WorkspaceResult result = 2;
  }
}

message WorkspaceResult {
  string commit = 1;
  string branch = 2;
  repeated PendingSubmodule pending_submodules = 3;
  // How the workspace was made, and its layers when by overlay.
  Strategy strategy = 4;
  Layers layers = 5;
  // The patterns the repository's .gitattributes sends to git LFS, e.g. "*.onnx": those files
  // are pointers in the workspace, as gitd does not download LFS objects. Empty when the
  // repository uses no LFS.
  repeated string lfs_patterns = 6;
}

message UpdateRequest {
  string path = 1;
  // Empty means the branch the workspace follows, also after a rollback left it detached.
  string branch = 2;
  bool with_submodules = 3;
  repeated Credential credentials = 4;
}

message UpdateResponse {
  oneof event {
    Progress progress = 1;
    WorkspaceResult result = 2;
  }
}

message CheckoutRequest {
  string path = 1;
  // Required: the commit to move to.
  string commit = 2;
  bool with_submodules = 3;
  repeated Credential credentials = 4;
}

message CheckoutResponse {
  oneof event {
    Progress progress = 1;
    WorkspaceResult result = 2;
  }
}

message SyncSubmodulesRequest {
  string path = 1;
  // Only this submodule, by repository URL. Empty means all of them.
  string only_url = 2;
  repeated Credential credentials = 3;
}

message SyncSubmodulesResponse {
  oneof event {
    Progress progress = 1;
    SyncSubmodulesResult result = 2;
  }
}

message SyncSubmodulesResult {
  repeated SubmoduleState submodules = 1;
  repeated PendingSubmodule pending_submodules = 2;
}

message DescribeRequest {
  string path = 1;
}

message DescribeResponse {
  string url = 1;
  string commit = 2;
  string branch = 3;
  // Whether something on disk differs from the commit, as somebody running git in it may
  // leave it.
  bool modified = 4;
  repeated SubmoduleState submodules = 5;
  // How the workspace was made, and its layers when by overlay. Workspaces made before
  // gitd said so read as STRATEGY_COPY.
  Strategy strategy = 6;
  Layers layers = 7;
  // The patterns its .gitattributes sends to git LFS, whose files are pointers here.
  repeated string lfs_patterns = 8;
}

message RemoveRequest {
  string path = 1;
}

message RemoveResponse {}

message SealRequest {
  // An overlay workspace, not itself standing on a warm layer.
  string path = 1;
  // What to call the layer: lowercase letters, digits, dots, dashes and underscores, 64 at
  // most. Sealing a name again replaces the layer, once no workspace stands on it.
  string name = 2;
}

message SealResponse {
  WarmLayer warm = 1;
}

// A layer sealed from a workspace, that later workspaces stand on.
message WarmLayer {
  string url = 1;
  string name = 2;
  // The commit it was sealed at: workspaces stand on it at that commit only.
  string commit = 3;
  // When it was sealed, in seconds since the epoch, and from which workspace.
  int64 sealed_at = 4;
  string sealed_from = 5;
  // How many files it changes that git does not ignore, e.g. a lock file rewritten.
  int32 changed_files = 6;
  // How many workspaces stand on it now.
  int32 users = 7;
}

message ListWarmRequest {
  string url = 1;
}

message ListWarmResponse {
  repeated WarmLayer warm = 1;
}

message AdoptRequest {
  string path = 1;
}

message AdoptResponse {
  oneof event {
    Progress progress = 1;
    AdoptResult result = 2;
  }
}

message AdoptResult {
  // Disk the workspace no longer holds because its pool does.
  int64 bytes_released = 1;
}

message PublishRequest {
  string path = 1;
  // A branch that does not exist yet: nothing is ever pushed over one that does. It must
  // start with `[publish] branch_prefix`, when the configuration sets one.
  string branch = 2;
  repeated Credential credentials = 3;
  // Who asked for the work, as their account on the git host, e.g. `josue`: written in the
  // pull request and the audit log, and asked to review when the settings say so. gitd
  // records it as told.
  string requested_by = 4;
  // This publish's pull request, beyond what the settings say.
  PullRequestOptions pull_request = 5;
  // Where the work came from, written in the pull request and the audit log as told.
  Provenance provenance = 6;
  // Publish what a sandbox pushed through the endpoint instead of a workspace: the ID of
  // its sandbox repository, with path left empty. branch names the branch it pushed there,
  // published under the same name.
  string sandbox = 7;
}

// Where a publish's work came from, as the platform says: gitd records it and never checks
// it, nor writes it into a commit. Each field is one line of at most 200 characters, never
// a secret; task_url is an https address.
message Provenance {
  // The agent, e.g. `claude-code` or `openhands`.
  string agent = 1;
  // The model it ran on.
  string model = 2;
  // The platform's name for the session or run.
  string session = 3;
  // Where the task is: an issue, a ticket.
  string task_url = 4;
}

// A publish's own say on its pull request. Unset fields take the settings'.
message PullRequestOptions {
  // Open one even when the settings open them only when asked.
  bool open = 1;
  // Empty: the subject of the newest commit.
  string title = 2;
  // The platform's text; gitd's account of what it checked follows it.
  string body = 3;
  // The branch it asks to merge into. Empty: the repository's default branch.
  string base = 4;
  optional bool draft = 5;
}

// A pull request gitd opened.
message OpenedPullRequest {
  string url = 1;
  int64 number = 2;
}

message PublishedRepository {
  string url = 1;
  // Where it is in the workspace: empty for the workspace's own repository.
  string path = 2;
  string commit = 3;
  // The subjects of the commits it brings, newest first: what a pull request is about.
  repeated string subjects = 4;
}

message PublishResponse {
  string branch = 1;
  PublishedRepository repository = 2;
  repeated PublishedRepository submodules = 3;
  // The pull request opened, when one was.
  OpenedPullRequest pull_request = 4;
  // Why the pull request could not be opened, when it was to be. The branch is published
  // all the same.
  GitFailure pull_request_failure = 5;
}

message ChangesRequest {
  string path = 1;
  // Files the base commit's .gitignore ignores, such as node_modules, are left out unless
  // asked for.
  bool include_ignored = 2;
}

message ChangedFile {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_MODIFIED = 2;
    KIND_DELETED = 3;
  }
  // Relative to the workspace, with `/`.
  string path = 1;
  Kind kind = 2;
  int32 added_lines = 3;
  int32 removed_lines = 4;
  // A binary file, whose lines are not counted.
  bool binary = 5;
}

message ChangesResponse {
  // The commit gitd last put the workspace on, which the changes are read against.
  string base = 1;
  repeated ChangedFile files = 2;
  // Read from the agent's own layer, with no git run in the workspace; otherwise read by
  // git in the workspace, which its sandbox should not be writing meanwhile.
  bool from_layer = 3;
}

message DiffRequest {
  string path = 1;
  // Only these files, relative to the workspace; all the changes when empty.
  repeated string files = 2;
  // At most this many bytes of diff: 512 KiB when unset, never more than 8 MiB.
  int64 max_bytes = 3;
  bool include_ignored = 4;
}

message DiffResponse {
  string base = 1;
  // The unified diff, with `a/` and `b/` before each path, as git writes it.
  string diff = 2;
  // Cut short at max_bytes.
  bool truncated = 3;
}

// One work to compare: a workspace, by its path, or a branch gitd published — or any
// branch its pool holds — by its name.
message Side {
  oneof of {
    string workspace = 1;
    string branch = 2;
  }
}

message CompareRequest {
  Side first = 1;
  Side second = 2;
  // The repository, when both sides are branches; a workspace says its own, and every side
  // must be of the same repository.
  string url = 3;
  bool include_ignored = 4;
  // The unified diff too, from first to second, cut short at max_bytes (512 KiB unless
  // said, never more than 8 MiB).
  bool with_diff = 5;
  int64 max_bytes = 6;
}

message CompareResponse {
  // From first to second: added is in second only, deleted in first only.
  repeated ChangedFile files = 1;
  string diff = 2;
  bool truncated = 3;
}

message ConflictsRequest {
  // At least two; a workspace stands for what it committed, which gitd brings into the pool
  // as publishing does, so its sandbox should not be writing meanwhile.
  repeated Side sides = 1;
  string url = 2;
}

// Two works that do not merge cleanly, and the files they conflict on.
message Conflict {
  Side first = 1;
  Side second = 2;
  repeated string paths = 3;
}

message ConflictsResponse {
  // Every pair that does not merge cleanly; none when all do.
  repeated Conflict conflicts = 1;
}

message WatchRequest {
  // Only these workspaces; every workspace when empty.
  repeated string paths = 1;
}

message WatchResponse {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_MADE = 1;
    // Something in the workspace changed: seen in the agent's layer of an overlay workspace,
    // within a couple of seconds, and coalesced.
    KIND_CHANGED = 2;
    KIND_PUBLISHED = 3;
    KIND_REFUSED = 4;
    KIND_REMOVED = 5;
  }
  Kind kind = 1;
  string path = 2;
  google.protobuf.Timestamp time = 3;
  // The branch, for a publish done or refused.
  string branch = 4;
  // The pull request opened, or why a publish was refused.
  string detail = 5;
}

message ProbeRequest {
  string url = 1;
  repeated Credential credentials = 2;
}

message ProbeResponse {
  enum Access {
    ACCESS_UNSPECIFIED = 0;
    // Read with nothing.
    ACCESS_PUBLIC = 1;
    // Read with the credentials given.
    ACCESS_REACHABLE = 2;
    // Not readable with what was given.
    ACCESS_DENIED = 3;
  }
  Access access = 1;
  repeated string branches = 2;
  // The branch the repository's HEAD points at.
  string default_branch = 3;
  GitFailure failure = 4;
  // The commit each branch points at, by branch: what a submodule's gitlink is set to.
  map<string, string> commits = 5;
}

message RetireRequest {
  // At least a day: a pool used moments ago is likely to be wanted again.
  int64 unused_for_seconds = 1;
}

message RetireResponse {
  int32 retired = 1;
  int64 freed_bytes = 2;
}

message InfoRequest {}

message InfoResponse {
  string version = 1;
  // What `git version` says, e.g. "git version 2.48.1".
  string git_version = 2;
  // How many pools there are and the disk they take, as of the last maintenance round.
  int32 pools = 3;
  int64 pools_bytes = 4;
  // How new workspaces are made on this machine, and why: what gitd detected at start.
  Strategy strategy = 5;
  string strategy_reason = 6;
  // How many templates there are and the disk they take, as of the last maintenance round.
  int32 templates = 7;
  int64 templates_bytes = 8;
}

message AuditRequest {
  // Only the entries from this time on; all of them when unset.
  google.protobuf.Timestamp since = 1;
  // Only the entries of this repository, as its URL is written in them.
  string url = 2;
  // At most this many, newest first: 100 when unset, never more than 1000.
  int32 limit = 3;
}

message AuditResponse {
  repeated AuditEntry entries = 1;
}

// One publish, done or refused, or one change to connections or publishing settings, as
// the audit log keeps it: one per line of the log file, in this message's JSON form.
message AuditEntry {
  google.protobuf.Timestamp time = 1;
  // The workspace's path, as the caller gave it.
  string workspace = 2;
  // The workspace's repository; empty when the workspace could not be opened.
  string url = 3;
  string branch = 4;
  // What was pushed: the workspace's repository, then each submodule. Unset when refused.
  PublishedRepository repository = 5;
  repeated PublishedRepository submodules = 6;
  // Why it was refused. Unset when it was published.
  GitFailure refusal = 7;
  // Who asked for the work, as the publish said.
  string requested_by = 8;
  // The pull request opened, or why it could not be.
  OpenedPullRequest pull_request = 9;
  GitFailure pull_request_failure = 10;
  // A change to connections or publishing settings; the other fields are then unset.
  ConfigurationChange change = 11;
  // Where the work came from, as the publish said.
  Provenance provenance = 12;
  // The sandbox repository published from, when it was not a workspace.
  string sandbox = 13;
}

// A connection added or removed, or the settings of a prefix set or removed.
message ConfigurationChange {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CONNECTION_ADDED = 1;
    ACTION_CONNECTION_REMOVED = 2;
    ACTION_SETTINGS_SET = 3;
    ACTION_SETTINGS_REMOVED = 4;
    ACTION_PRESET_SET = 5;
    ACTION_PRESET_REMOVED = 6;
    ACTION_TOKEN_ISSUED = 7;
    ACTION_TOKEN_REVOKED = 8;
  }
  Action action = 1;
  // The connection's ID, the settings' prefix, the preset's name, or the token's ID.
  string subject = 2;
  // What it opens or applies to, e.g. `https://github.com/acme`.
  string url_prefix = 3;
}

// One credential gitd keeps.
message Connection {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TOKEN = 1;
    KIND_SSH_KEY = 2;
    // A GitHub App: its installation tokens open one repository each, for an hour.
    KIND_GITHUB_APP = 3;
    // A person signed in through gitd's public App: their tokens, renewed by gitd.
    KIND_GITHUB_LOGIN = 4;
  }
  // gitd's name for it, to remove it by.
  string id = 1;
  Kind kind = 2;
  // The repositories it opens: those whose address starts with this.
  string url_prefix = 3;
  // Whom it acts as: the App's bot (`acme-agents[bot]`) or the person (`josue`). Empty for
  // a token or a key.
  string acts_as = 4;
  // For an App: its ID, and where its installations are managed.
  int64 app_id = 5;
  string manage_url = 6;
  // When it stops working unless renewed: a sign-in's renewal ends then.
  google.protobuf.Timestamp expires = 7;
  // From the configuration file: shown, never changed through the API.
  bool from_file = 8;
  google.protobuf.Timestamp created = 9;
}

message BeginGitHubAppRequest {
  // The GitHub host: empty for github.com, or a GitHub Enterprise Server's.
  string host = 1;
  // The organisation that owns the App. Empty: the account of the person creating it.
  string organization = 2;
  // The App's name on GitHub, e.g. `acme-agents`; its bot is `acme-agents[bot]`.
  string name = 3;
  // Where GitHub sends the person once the App is created: the platform's page, which
  // hands the code and state to CompleteGitHubApp.
  string redirect_url = 4;
}

message BeginGitHubAppResponse {
  // Where the person's browser posts the manifest, as a form field named `manifest`.
  string form_action = 1;
  // The manifest, in JSON: the App's name, its permissions (contents and pull requests,
  // read and write; metadata, read), no webhook.
  string manifest = 2;
  // Ties GitHub's answer to this request; expires in an hour.
  string state = 3;
}

message CompleteGitHubAppRequest {
  string code = 1;
  string state = 2;
}

message CompleteGitHubAppResponse {
  Connection connection = 1;
  // Where the person installs the App on the repositories it may reach.
  string install_url = 2;
}

message StartGitHubLoginRequest {
  // The GitHub host: empty for github.com.
  string host = 1;
}

message StartGitHubLoginResponse {
  // What the person enters at `verification_url`.
  string user_code = 1;
  string verification_url = 2;
  // Hands this sign-in to FinishGitHubLogin.
  string login_id = 3;
  // How long the code is good for.
  int32 expires_in_seconds = 4;
}

message FinishGitHubLoginRequest {
  string login_id = 1;
}

message FinishGitHubLoginResponse {
  Connection connection = 1;
  // Where the person installs gitd's App on the repositories it may reach, if not yet.
  string install_url = 2;
}

message AddGitHubAppRequest {
  // The GitHub host: empty for github.com.
  string host = 1;
  int64 app_id = 2;
  // The App's private key, in PEM.
  string private_key = 3;
  // The repositories it opens. Empty: every repository on the host its installations reach.
  string url_prefix = 4;
}

message AddGitHubAppResponse {
  Connection connection = 1;
}

message AddTokenRequest {
  // Must name the host, e.g. `https://gitlab.example.com/acme`.
  string url_prefix = 1;
  string token = 2;
  // As `Credential.https_user`.
  string user = 3;
}

message AddTokenResponse {
  Connection connection = 1;
}

message ListConnectionsRequest {}

message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message RemoveConnectionRequest {
  string id = 1;
}

message RemoveConnectionResponse {}

// The rules publishing follows for the repositories under a prefix.
//
// Every setting whose prefix opens a repository applies to it: their paths add up and the
// smallest file limit wins, so a narrower setting never loosens a broader one. A branch
// prefix and pull request choices are the most specific setting's, and a narrower branch
// prefix must start with every broader one.
message PublishSettings {
  // The repositories these apply to; empty for every repository.
  string url_prefix = 1;
  // The name of a preset whose rules these take, and which the fields below add to.
  string preset = 2;
  // Paths a publish may not change, as git's glob pathspecs, e.g. `.github/workflows/**`.
  repeated string protected_paths = 3;
  // Paths a publish may change but not delete or rename away, e.g. `tests/**`.
  repeated string kept_paths = 4;
  // At most this many files changed; unset for the preset's, or no limit.
  optional int32 max_changed_files = 5;
  // What every published branch must start with, e.g. `agents/`.
  string branch_prefix = 6;
  PullRequestSettings pull_requests = 7;
  // From the configuration file: shown, never changed through the API.
  bool from_file = 8;
  // Paths these settings' own rules — their preset's and their own — leave free, as glob
  // pathspecs, e.g. `.gitmodules` under `recommended`. They never free what another
  // setting protects or keeps.
  repeated string allowed_paths = 9;
}

// A named set of rules settings take. gitd has its own `recommended`: it protects
// `.github/workflows/**`, `.gitlab-ci.yml`, `CODEOWNERS` and `.gitmodules`, keeps tests
// (`**/*_test.*`, `**/*.test.*`, `**/test/**`, `**/tests/**`, `**/__tests__/**`) and
// allows at most 200 files changed; a preset of that name replaces it.
message Preset {
  // Lowercase letters, digits, `-`, `_` and `.`, up to 64.
  string name = 1;
  repeated string protected_paths = 2;
  repeated string kept_paths = 3;
  optional int32 max_changed_files = 4;
  // Where it comes from: gitd's own, the configuration file, or the API.
  enum Origin {
    ORIGIN_UNSPECIFIED = 0;
    ORIGIN_BUILT_IN = 1;
    ORIGIN_FILE = 2;
    ORIGIN_API = 3;
  }
  Origin origin = 5;
}

// How publishes open pull requests.
message PullRequestSettings {
  enum Open {
    OPEN_UNSPECIFIED = 0;
    // Only when the publish asks (`PullRequestOptions.open`).
    OPEN_WHEN_ASKED = 1;
    OPEN_ALWAYS = 2;
  }
  Open open = 1;
  bool draft = 2;
  repeated string labels = 3;
  // Ask the person the publish names in `requested_by` to review it.
  bool request_review_from_requester = 4;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated PublishSettings settings = 1;
}

message SetSettingsRequest {
  PublishSettings settings = 1;
}

message SetSettingsResponse {
  PublishSettings settings = 1;
}

message RemoveSettingsRequest {
  string url_prefix = 1;
}

message RemoveSettingsResponse {}

message ListPresetsRequest {}

message ListPresetsResponse {
  repeated Preset presets = 1;
}

message SetPresetRequest {
  Preset preset = 1;
}

message SetPresetResponse {
  Preset preset = 1;
}

message RemovePresetRequest {
  string name = 1;
}

message RemovePresetResponse {}

message IssueTokenRequest {
  string url = 1;
  // The branch the sandbox starts from; empty for the repository's default branch.
  string branch = 2;
  // How long the token lives: an hour when zero, a day at most.
  int64 lifetime_seconds = 3;
  // A token that clones and fetches only.
  bool read_only = 4;
  // A sandbox repository the token writes to, from an earlier token; empty makes a new one.
  string sandbox = 5;
}

message IssueTokenResponse {
  // The token, shown this once: gitd keeps only its hash.
  string token = 1;
  TokenInfo info = 2;
  // Where the sandbox clones from, e.g. `https://gitd.internal:9420/git/github.com/acme/web.git`,
  // with the token as the password: `git clone https://x:<token>@…`.
  string clone_url = 3;
}

// A token as gitd shows it, never its secret.
message TokenInfo {
  string id = 1;
  string url = 2;
  string sandbox = 3;
  bool writable = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message RevokeTokenRequest {
  string id = 1;
  // Remove its sandbox repository too, with whatever was pushed there and not published.
  bool remove_sandbox = 2;
}

message RevokeTokenResponse {}

message ListTokensRequest {}

message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}
